name: Ads Readiness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-ads-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Ads readiness tests
        run: npm run test:ads-readiness

      - name: Run build
        run: npm run build

      - name: Syntax checks
        run: |
          node --check js/tracking/consent-banner.js
          node --check js/tracking/site-consent-bootstrap.js
          node --check js/tracking/ads-loader.js
          node --check js/tracking/tracking.js
          node --check js/starter-assessment.js
          node --check js/starter-context.js
          node --check js/starter-result.js
          node --check lib/starter-assessment/submit-handler.cjs
          node --check lib/starter-assessment/validation.cjs
